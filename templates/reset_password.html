{% extends 'base.html' %}{% block title %}Reset password · EFMS{% endblock %}{% block content %}<div class="center-card"><div class="icon-bubble">🔐</div><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Set a new password</h1><p>Enter the code sent to <b>{{ email }}</b>, then choose a new password.</p><form method="post"><input type="hidden" name="email" value="{{ email }}"><label>6-digit reset code</label><input class="otp-input" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><label>New password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"><button class="btn btn-primary btn-block" type="submit">Update password</button></form></div>{% endblock %}
